# refund-service. Secrets come only from environment variables.
server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: refund-service
  datasource:
    url: jdbc:postgresql://${REFUND_DB_HOST:localhost}:${REFUND_DB_PORT:5432}/refund_db?sslmode=${REFUND_DB_SSLMODE:prefer}
    username: ${REFUND_DB_USER:refund_app}
    password: ${REFUND_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

hpg:
  security:
    jwk-set-uri: ${HPG_MERCHANT_SERVICE_URI:http://localhost:8081}/oauth2/jwks
    issuer: ${HPG_TOKEN_ISSUER:http://localhost:8081}
  refund:
    # razorpay (needs RAZORPAY_* test keys) | simulated (local demos only, no money moves)
    provider: ${HPG_PAYMENT_PROVIDER:razorpay}
    refund-window: 180d
    idempotency-ttl: 24h
    jobs:
      enabled: true
      interval: PT30S
      batch-size: 50
      created-retry-after: 30s
      unknown-verify-after: 30s
      processing-verify-after: 2m
      max-provider-attempts: 5
    razorpay:
      base-url: https://api.razorpay.com
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
---
spring:
  config:
    activate:
      on-profile: local
    import:
      - optional:file:../../deploy/env/.env[.properties]
      - optional:file:./deploy/env/.env[.properties]
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/refund_db
logging:
  structured:
    format:
      console: ecs
---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  structured:
    format:
      console: ecs
