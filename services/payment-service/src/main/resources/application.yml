# payment-service. Secrets come only from environment variables.
server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5432}/payment_db
    username: ${PAYMENT_DB_USER:payment_app}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

hpg:
  security:
    # Tokens are issued by merchant-service; payment-service validates them with its public keys.
    jwk-set-uri: ${HPG_MERCHANT_SERVICE_URI:http://localhost:8081}/oauth2/jwks
    issuer: ${HPG_TOKEN_ISSUER:http://localhost:8081}
    encryption-key: ${HPG_ENCRYPTION_KEY:}
  payment:
    # razorpay (needs RAZORPAY_* test keys) | simulated (local demos only, no money moves)
    provider: ${HPG_PAYMENT_PROVIDER:razorpay}
    checkout-base-url: ${HPG_CHECKOUT_BASE_URL:http://localhost:8080/checkout}
    allow-insecure-return-urls: ${HPG_ALLOW_INSECURE_WEBHOOKS:false}
    capture-window: 5d
    idempotency-ttl: 24h
    webhook-max-age: 48h
    business-zone: Asia/Kolkata
    jobs:
      enabled: true
      interval: PT1M
      batch-size: 50
      created-retry-after: 30s
      processing-verify-after: 2m
      unknown-verify-after: 30s
      pending-verify-interval: 10m
    razorpay:
      base-url: https://api.razorpay.com
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        provider.requests: true
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
---
spring:
  config:
    activate:
      on-profile: local
    import:
      - optional:file:../../deploy/env/.env[.properties]
      - optional:file:./deploy/env/.env[.properties]
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/payment_db
logging:
  structured:
    format:
      console: ecs
---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  structured:
    format:
      console: ecs
