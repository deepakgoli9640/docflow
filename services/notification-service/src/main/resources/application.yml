# notification-service. Secrets come only from environment variables.
server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${NOTIFICATION_DB_HOST:localhost}:${NOTIFICATION_DB_PORT:5432}/notification_db?sslmode=${NOTIFICATION_DB_SSLMODE:prefer}
    username: ${NOTIFICATION_DB_USER:notification_app}
    password: ${NOTIFICATION_DB_PASSWORD:}
    hikari:
      # A statement may run at most this long (a stuck lock or overloaded database); answered 503.
      connection-init-sql: SET statement_timeout = '${HPG_DB_STATEMENT_TIMEOUT:30s}'
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      ack-mode: record
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

hpg:
  security:
    jwk-set-uri: ${HPG_MERCHANT_SERVICE_URI:http://localhost:8081}/oauth2/jwks
    issuer: ${HPG_TOKEN_ISSUER:http://localhost:8081}
    oidc:                       # dashboard single sign-on (Keycloak); off when HPG_OIDC_ISSUER is empty
      issuer: ${HPG_OIDC_ISSUER:}
      jwk-set-uri: ${HPG_OIDC_JWK_SET_URI:}
      audience: ${HPG_OIDC_AUDIENCE:hpg-api}
    encryption-key: ${HPG_ENCRYPTION_KEY:}
  notification:
    merchant-service-uri: ${HPG_MERCHANT_SERVICE_URI:http://localhost:8081}
    client-id: notification-service
    client-secret: ${HPG_NOTIFICATION_CLIENT_SECRET:}
    webhook-config-cache-ttl: 60s
    # Local development only: allow http:// and private-network webhook URLs (same switch as merchant-service).
    allow-insecure-webhooks: ${HPG_ALLOW_INSECURE_WEBHOOKS:false}
    email-from: ${HPG_EMAIL_FROM:payments@hpg.local}
    sms:                                  # patient text messages (receipt, failed, expired)
      enabled: ${HPG_SMS_ENABLED:true}
      provider: ${HPG_SMS_PROVIDER:log}   # log (local: logged with a masked number) | msg91
      msg91:
        base-url: ${MSG91_BASE_URL:https://control.msg91.com}
        auth-key: ${MSG91_AUTH_KEY:}
        templates:                        # DLT-registered template (flow) ids per message type
          "[payment.captured]": ${MSG91_TEMPLATE_CAPTURED:}
          "[payment.failed]": ${MSG91_TEMPLATE_FAILED:}
          "[payment.expired]": ${MSG91_TEMPLATE_EXPIRED:}
    connect-timeout: 3s
    request-timeout: 10s
    dispatch:
      enabled: true
      interval: 1s
      batch-size: 50
      lease: 2m
      initial-backoff: 10s
      max-backoff: 1h
      max-age: 24h
      max-attempts: 20

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
---
spring:
  config:
    activate:
      on-profile: local
    import:
      - optional:file:../../deploy/env/.env[.properties]
      - optional:file:./deploy/env/.env[.properties]
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/notification_db
logging:
  structured:
    format:
      console: ecs
---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  structured:
    format:
      console: ecs
