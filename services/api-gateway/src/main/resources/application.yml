# api-gateway: the single entry point. Routes to every business service; reconciliation arrives later.
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          # The 1 MB request-size limit is set per route (not here): a default filter cannot be loosened by a
          # route, and settlement-file uploads need 20 MB.
          default-filters:
            - DedupeResponseHeader=X-Correlation-Id, RETAIN_FIRST
            - SecureHeaders
          filter:
            secure-headers:
              # Each service sets a Content-Security-Policy fitting its content (the checkout page needs a
              # nonce-based one). A second, generic CSP from the gateway would be enforced in addition and
              # block the checkout script.
              disable: content-security-policy
          routes:
            # --- merchant-service -------------------------------------------------------
            - id: oauth2-token
              uri: ${HPG_MERCHANT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/oauth2/token,/oauth2/jwks
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while merchant-service is failing (resilience4j below)
                  args:
                    name: merchant-service
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_TOKEN_PER_SEC:5}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_TOKEN_BURST:10}
            - id: merchant-registration
              uri: ${HPG_MERCHANT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/merchants
                - Method=POST
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while merchant-service is failing (resilience4j below)
                  args:
                    name: merchant-service
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_REGISTER_PER_SEC:1}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_REGISTER_BURST:5}
            - id: merchant-api
              uri: ${HPG_MERCHANT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/merchants/me,/api/v1/merchants/me/**,/api/v1/admin/merchants,/api/v1/admin/merchants/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while merchant-service is failing (resilience4j below)
                  args:
                    name: merchant-service
                - name: Retry                     # safe reads only, on another instance; writes are retried by clients
                  args:
                    retries: 2
                    methods: GET
                    series: ""
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_API_PER_SEC:50}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_API_BURST:100}

            # --- payment-service --------------------------------------------------------
            - id: payment-api
              uri: ${HPG_PAYMENT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/payments,/api/v1/payments/**,/api/v1/disputes,/api/v1/disputes/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while payment-service is failing (resilience4j below)
                  args:
                    name: payment-service
                - name: Retry                     # safe reads only, on another instance; writes are retried by clients
                  args:
                    retries: 2
                    methods: GET
                    series: ""
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_API_PER_SEC:50}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_API_BURST:100}
            - id: checkout
              uri: ${HPG_PAYMENT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/checkout/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while payment-service is failing (resilience4j below)
                  args:
                    name: payment-service
                - name: Retry                     # safe reads only, on another instance; writes are retried by clients
                  args:
                    retries: 2
                    methods: GET
                    series: ""
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_CHECKOUT_PER_SEC:10}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_CHECKOUT_BURST:20}
            - id: payment-webhooks
              uri: ${HPG_PAYMENT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/webhooks/razorpay/payments
                - Method=POST
              filters:
                - name: RequestSize
                  args:
                    maxSize: 64KB
                - name: CircuitBreaker            # fail fast while payment-service is failing (resilience4j below)
                  args:
                    name: payment-service

            # --- refund-service ---------------------------------------------------------
            - id: refund-api
              uri: ${HPG_REFUND_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/refunds,/api/v1/refunds/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while refund-service is failing (resilience4j below)
                  args:
                    name: refund-service
                - name: Retry                     # safe reads only, on another instance; writes are retried by clients
                  args:
                    retries: 2
                    methods: GET
                    series: ""
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_API_PER_SEC:50}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_API_BURST:100}
            - id: refund-webhooks
              uri: ${HPG_REFUND_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/webhooks/razorpay/refunds
                - Method=POST
              filters:
                - name: RequestSize
                  args:
                    maxSize: 64KB
                - name: CircuitBreaker            # fail fast while refund-service is failing (resilience4j below)
                  args:
                    name: refund-service

            # --- transaction-service ----------------------------------------------------
            - id: transaction-api
              uri: ${HPG_TRANSACTION_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/transactions,/api/v1/transactions/**,/api/v1/reports/**,/api/v1/admin/ledger/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while transaction-service is failing (resilience4j below)
                  args:
                    name: transaction-service
                - name: Retry                     # safe reads only, on another instance; writes are retried by clients
                  args:
                    retries: 2
                    methods: GET
                    series: ""
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_API_PER_SEC:50}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_API_BURST:100}

            # --- notification-service ---------------------------------------------------
            - id: notification-api
              uri: ${HPG_NOTIFICATION_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**,/api/v1/admin/notifications/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while notification-service is failing (resilience4j below)
                  args:
                    name: notification-service
                - name: Retry                     # safe reads only, on another instance; writes are retried by clients
                  args:
                    retries: 2
                    methods: GET
                    series: ""
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_API_PER_SEC:50}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_API_BURST:100}

            # --- reconciliation-service (OPS) ------------------------------------------
            - id: reconciliation-upload
              uri: ${HPG_RECON_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/reconciliation/settlement-files
                - Method=POST
              filters:
                - name: RequestSize
                  args:
                    maxSize: 21MB
                - name: CircuitBreaker            # fail fast while reconciliation-service is failing (resilience4j below)
                  args:
                    name: reconciliation-service
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
            - id: reconciliation-api
              uri: ${HPG_RECON_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/reconciliation/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - name: CircuitBreaker            # fail fast while reconciliation-service is failing (resilience4j below)
                  args:
                    name: reconciliation-service
                - name: Retry                     # safe reads only, on another instance; writes are retried by clients
                  args:
                    retries: 2
                    methods: GET
                    series: ""
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: ${HPG_RATE_API_PER_SEC:50}
                    redis-rate-limiter.burstCapacity: ${HPG_RATE_API_BURST:100}

hpg:
  gateway:
    deny-list:
      # Longer than the 15-minute token lifetime: after that a suspended merchant has no valid token left.
      ttl: 20m
    jwt:
      jwk-set-uri: ${HPG_MERCHANT_SERVICE_URI:http://localhost:8081}/oauth2/jwks
      issuer: ${HPG_TOKEN_ISSUER:http://localhost:8081}
    oidc:                       # dashboard single sign-on (Keycloak); off when HPG_OIDC_ISSUER is empty
      issuer: ${HPG_OIDC_ISSUER:}
      jwk-set-uri: ${HPG_OIDC_JWK_SET_URI:}
      audience: ${HPG_OIDC_AUDIENCE:hpg-api}

# Circuit breakers (one per downstream service, used by the routes above). They count what says "the service is
# down or hung": refused or dropped connections and timeouts. A service's own 4xx/5xx answers pass through
# unchanged (with its problem details). A service failing half of the last 20 calls is skipped for 10 s: callers get 503 at once instead of waiting for timeouts, and the service gets room to
# recover. The time limit sits above the HTTP client's 10 s response timeout, so that timeout fires first.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 12s

management:
  server:
    # Actuator on its own port: reachable by Prometheus / orchestrator inside the network, never via the
    # public listener on 8080.
    port: ${HPG_GATEWAY_MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
---
# Running from the IDE or `mvn spring-boot:run` against `--profile infra`: activate profile "local" to read
# the same deploy/env/.env file Docker Compose uses. Only under this profile, so automated tests can never
# pick up a developer's local settings.
spring:
  config:
    activate:
      on-profile: local
    import:
      - optional:file:../../deploy/env/.env[.properties]
      - optional:file:./deploy/env/.env[.properties]
---
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
