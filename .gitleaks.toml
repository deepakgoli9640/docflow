# Secret scanning (CI job "secrets"). Gitleaks' default rules, plus an allowlist for values that are
# deliberately fake: test fixtures (throwaway keys for Testcontainers) and the .env template.
# Real secrets live only in deploy/env/.env, which is git-ignored and generated by scripts/init-env.sh.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and templates with fake values"
paths = [
  '''(^|/)src/test/''',
  '''^deploy/env/\.env\.example$''',
]
