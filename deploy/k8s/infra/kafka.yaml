# Kafka for HPG with the Strimzi operator (https://strimzi.io, >= 0.45), KRaft mode (no ZooKeeper):
# 3 nodes acting as controllers and brokers, spread over zones. Topics are replicated 3 times with
# min.insync.replicas=2, and producers use acks=all: an acknowledged event is on at least two brokers, and one
# broker can fail without stopping producers or consumers.
# The services create their topics at startup with these settings (hpg.messaging.consumer.topic-replicas /
# min-insync-replicas, set by the Helm chart). Bootstrap: hpg-kafka-kafka-bootstrap:9092.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: hpg-kafka
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { memory: 4Gi }
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { strimzi.io/pool-name: dual-role }
              topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: hpg-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false              # inside the cluster network; use the tls listener + mTLS if policy requires
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false   # topics are created deliberately, with the settings above
      unclean.leader.election.enable: false
    rack:
      topologyKey: topology.kubernetes.io/zone
  entityOperator:
    topicOperator: {}
