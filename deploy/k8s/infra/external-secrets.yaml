# Secrets for HPG from a secret manager with External Secrets Operator (https://external-secrets.io).
# Nothing secret is stored in git or Helm values: the operator copies values from the manager into
# Kubernetes Secrets and refreshes them, so a rotated value reaches the pods on their next restart
# (`kubectl rollout restart deployment -l app.kubernetes.io/part-of=hpg`).
# Example for AWS Secrets Manager with IRSA; Vault, GCP and Azure work the same with another SecretStore.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: hpg-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: hpg-external-secrets     # IAM role allowed to read secret hpg/* only
---
# Application secrets: one JSON secret "hpg/app" in the manager, one key per variable.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hpg-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hpg-secrets-manager, kind: SecretStore }
  target:
    name: hpg-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hpg/app      # MERCHANT_DB_PASSWORD, PAYMENT_DB_PASSWORD, ..., HPG_ENCRYPTION_KEY, RAZORPAY_*, SMTP_*, REDIS_PASSWORD
---
# Token signing key pair. Rotation: put the new pair here and the old public key into
# HPG_JWT_PREVIOUS_PUBLIC_KEY_LOCATIONS (docs/09-security.md, "Signing-key rotation").
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hpg-jwt
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hpg-secrets-manager, kind: SecretStore }
  target:
    name: hpg-jwt
    creationPolicy: Owner
  data:
    - secretKey: private.pem
      remoteRef: { key: hpg/jwt, property: private_pem }
    - secretKey: public.pem
      remoteRef: { key: hpg/jwt, property: public_pem }
