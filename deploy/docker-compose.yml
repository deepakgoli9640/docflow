# Healthcare Payment Gateway - local environment.
#
# NOTHING starts without a profile. Pick what you need (see docs/12-deployment-local-dev.md):
#   docker compose -f deploy/docker-compose.yml --profile infra up -d                 # Postgres + Redis + Kafka
#   docker compose -f deploy/docker-compose.yml --profile infra --profile core up -d  # + gateway, merchant, payment
#   ... --profile refund --profile transactions --profile notify                     # + the other services
#   ... --profile recon                                                              # reconciliation-service
#   ... --profile dashboard                                                          # web dashboard on :8090
#   HPG_TRACE_EXPORT=true ... --profile obs                                          # Prometheus, Grafana, Jaeger
#
# Prerequisites:  ./scripts/init-env.sh   and   ./mvnw -DskipTests package

name: hpg

services:
  postgres:
    image: postgres:16-alpine
    profiles: [infra]
    env_file: ./env/.env
    # Small-memory tuning; plenty for local work.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=120", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    profiles: [infra]
    # Rate-limit buckets and the deny-list are disposable: no persistence, bounded memory.
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m

  kafka:
    image: apache/kafka:3.9.1
    profiles: [infra]
    # Single KRaft node (no ZooKeeper). Two listeners: containers use kafka:19092, the host (services run
    # from the IDE) uses localhost:9092.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    mem_limit: 640m

  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [notify]
    # Catches every email locally; web UI on http://localhost:8025
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    mem_limit: 64m

  merchant-service:
    profiles: [core]
    build: ../services/merchant-service
    image: hpg/merchant-service:local
    env_file: ./env/.env
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      HPG_TRACE_EXPORT: ${HPG_TRACE_EXPORT:-false}   # true with --profile obs
      MERCHANT_DB_HOST: postgres
      HPG_TOKEN_ISSUER: http://merchant-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8081:8081"   # published for debugging only; clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    mem_limit: 512m

  payment-service:
    profiles: [core]
    build: ../services/payment-service
    image: hpg/payment-service:local
    env_file: ./env/.env
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      HPG_TRACE_EXPORT: ${HPG_TRACE_EXPORT:-false}   # true with --profile obs
      PAYMENT_DB_HOST: postgres
      HPG_MERCHANT_SERVICE_URI: http://merchant-service:8081
      HPG_TOKEN_ISSUER: http://merchant-service:8081
      HPG_CHECKOUT_BASE_URL: http://localhost:8080/checkout
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8082:8082"   # debugging only; clients and patients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    mem_limit: 512m

  refund-service:
    profiles: [refund]
    build: ../services/refund-service
    image: hpg/refund-service:local
    env_file: ./env/.env
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      HPG_TRACE_EXPORT: ${HPG_TRACE_EXPORT:-false}   # true with --profile obs
      REFUND_DB_HOST: postgres
      HPG_MERCHANT_SERVICE_URI: http://merchant-service:8081
      HPG_TOKEN_ISSUER: http://merchant-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8083:8083"   # debugging only; clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    mem_limit: 512m

  transaction-service:
    profiles: [transactions]
    build: ../services/transaction-service
    image: hpg/transaction-service:local
    env_file: ./env/.env
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      HPG_TRACE_EXPORT: ${HPG_TRACE_EXPORT:-false}   # true with --profile obs
      TRANSACTION_DB_HOST: postgres
      HPG_MERCHANT_SERVICE_URI: http://merchant-service:8081
      HPG_TOKEN_ISSUER: http://merchant-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8084:8084"   # debugging only; clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    mem_limit: 512m

  notification-service:
    profiles: [notify]
    build: ../services/notification-service
    image: hpg/notification-service:local
    env_file: ./env/.env
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      HPG_TRACE_EXPORT: ${HPG_TRACE_EXPORT:-false}   # true with --profile obs
      NOTIFICATION_DB_HOST: postgres
      HPG_MERCHANT_SERVICE_URI: http://merchant-service:8081
      HPG_TOKEN_ISSUER: http://merchant-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:8085:8085"   # debugging only; clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    mem_limit: 512m

  reconciliation-service:
    profiles: [recon]
    build: ../services/reconciliation-service
    image: hpg/reconciliation-service:local
    env_file: ./env/.env
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      HPG_TRACE_EXPORT: ${HPG_TRACE_EXPORT:-false}   # true with --profile obs
      RECON_DB_HOST: postgres
      HPG_MERCHANT_SERVICE_URI: http://merchant-service:8081
      HPG_TOKEN_ISSUER: http://merchant-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Local demos: flag ledger transactions missing from the uploaded report at once instead of after T+3.
      HPG_RECON_SETTLEMENT_WINDOW_DAYS: "0"
    ports:
      - "127.0.0.1:8086:8086"   # debugging only; clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    mem_limit: 512m

  api-gateway:
    profiles: [core]
    build: ../services/api-gateway
    image: hpg/api-gateway:local
    env_file: ./env/.env
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      HPG_TRACE_EXPORT: ${HPG_TRACE_EXPORT:-false}   # true with --profile obs
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092   # merchant snapshots feed the suspended-merchant deny-list
      HPG_MERCHANT_SERVICE_URI: http://merchant-service:8081
      HPG_PAYMENT_SERVICE_URI: http://payment-service:8082
      HPG_REFUND_SERVICE_URI: http://refund-service:8083
      HPG_TRANSACTION_SERVICE_URI: http://transaction-service:8084
      HPG_NOTIFICATION_SERVICE_URI: http://notification-service:8085
      HPG_RECON_SERVICE_URI: http://reconciliation-service:8086
      HPG_TOKEN_ISSUER: http://merchant-service:8081
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    mem_limit: 384m

  dashboard:
    profiles: [dashboard]
    build: ../ui/dashboard
    image: hpg/dashboard:local
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://api-gateway:8080
    ports:
      - "127.0.0.1:8090:8090"   # hospital and operations dashboard
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 32m

  # --- observability (profile "obs"): docs/10-observability.md ------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [obs]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI; services send spans to jaeger:4318 (OTLP/HTTP) inside the network
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [obs]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [obs]
    env_file: ./env/.env               # GF_SECURITY_ADMIN_PASSWORD
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # local only: dashboards readable without signing in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hpg-payments.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, jaeger]
    mem_limit: 192m

volumes:
  postgres-data:
  kafka-data:
