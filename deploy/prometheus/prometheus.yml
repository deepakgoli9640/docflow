# Scrapes every HPG service's /actuator/prometheus (the gateway serves it on its management port 9080).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hpg-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - merchant-service:8081
          - payment-service:8082
          - refund-service:8083
          - transaction-service:8084
          - notification-service:8085
          - reconciliation-service:8086
          - api-gateway:9080
